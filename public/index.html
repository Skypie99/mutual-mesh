<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- Attribution + share metadata (truthful: a web app, no app-store claim). -->
    <meta name="description" content="Privacy-first mutual-aid marketplace for food, baby supplies, hygiene and HRT. Invite-only, neighbourhood-level (never an address). A project by Sky Halisky." />
    <meta name="author" content="Sky Halisky" />
    <link rel="canonical" href="https://mutual-mesh.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mutual Mesh" />
    <meta property="og:title" content="Mutual Mesh — privacy-first mutual aid" />
    <meta property="og:description" content="Invite-only, neighbourhood-level mutual aid for food, baby supplies, hygiene and HRT. Built not to surveil. A project by Sky Halisky." />
    <meta property="og:url" content="https://mutual-mesh.vercel.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mutual Mesh — privacy-first mutual aid" />
    <meta name="twitter:description" content="Invite-only, neighbourhood-level mutual aid for food, baby supplies, hygiene and HRT. Built not to surveil." />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F3EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0D0B" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="mm-a11y-focus">
      /* WCAG 2.4.7 — visible keyboard focus on the web build, mirroring the
         same safety-net pattern used in AccessMap's web/index.html. */
      :focus-visible {
        outline: 2px solid #1F7A6A;
        outline-offset: 2px;
        border-radius: 3px;
      }
    </style>
    <style id="mm-splash-style">
      /* Instant-paint brand splash shown before the JS bundle mounts (2026-07-14
         addition — this app previously rendered a bare <div id="root"></div>,
         a genuinely blank white screen until the ~1.7MB bundle parsed). Pure
         HTML + CSS, no JS required, so it paints on first frame regardless of
         connection speed. Colors are Mutual Mesh's own tokens (src/lib/theme.ts). */
      html, body { background: #F7F3EE; }

      #mm-splash {
        margin: auto;
        max-width: 28rem;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #mm-splash .mm-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 14px;
        background: #1F7A6A;
      }
      #mm-splash .mm-mark span {
        color: #FFFFFF;
        font-size: 26px;
        font-weight: 800;
      }
      #mm-splash .mm-name { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.6px; color: #1A1916; }
      #mm-splash .mm-tag { margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #4A3D2C; }
      #mm-splash .mm-by { margin: 18px 0 0; font-size: 14px; color: #6B5640; }
      #mm-splash .mm-by a { color: #1F7A6A; font-weight: 600; text-decoration: none; }
      #mm-splash .mm-by a:hover, #mm-splash .mm-by a:focus { text-decoration: underline; }

      #mm-splash .mm-dots { display: flex; gap: 8px; justify-content: center; margin: 22px 0 0; }
      #mm-splash .mm-dots span {
        width: 8px; height: 8px; border-radius: 50%;
        background: #1F7A6A; opacity: 0.35;
        animation: mm-dot 1.2s ease-in-out infinite;
      }
      #mm-splash .mm-dots span:nth-child(2) { animation-delay: 0.18s; }
      #mm-splash .mm-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes mm-dot {
        0%, 80%, 100% { opacity: 0.35; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }

      @media (prefers-color-scheme: dark) {
        html, body { background: #0E0D0B; }
        #mm-splash .mm-mark { background: #4FBFA8; }
        #mm-splash .mm-mark span { color: #0E0D0B; }
        #mm-splash .mm-name { color: #F5F2EE; }
        #mm-splash .mm-tag { color: #D9CBBA; }
        #mm-splash .mm-by { color: #A8957D; }
        #mm-splash .mm-by a { color: #4FBFA8; }
        #mm-splash .mm-dots span { background: #4FBFA8; }
      }

      @media (prefers-reduced-motion: reduce) {
        #mm-splash .mm-dots span { animation: none; opacity: 0.6; transform: none; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <!-- Honest no-JS fallback (2026-07-14): previously the one-line sentence
         below was the ONLY thing a JS-off visitor or crawler ever saw. Adds a
         title + one honest line + a link back to the project write-up, same
         pattern as AccessMap's public/index.html. -->
    <noscript>
      You need to enable JavaScript to run this app.
      <div style="max-width: 28rem; margin: 4rem auto; padding: 24px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #4A3D2C;">
        <h1 style="font-size: 28px; font-weight: 800; letter-spacing: -0.6px; color: #1A1916; margin: 0 0 12px;">Mutual Mesh</h1>
        <p style="font-size: 16px; line-height: 1.5; margin: 0 0 16px;">This app needs JavaScript to run — it's a client-only React Native for Web build, and there's no server-rendered version yet.</p>
        <p style="font-size: 15px; margin: 0;">
          <a href="https://skypistudio.com/work/mutual-mesh/" style="color: #1F7A6A; font-weight: 600; text-decoration: underline;">Read the project write-up at skypistudio.com &#8594;</a>
        </p>
      </div>
    </noscript>
    <!-- The root element for your Expo app. The brand splash inside it paints
         instantly and is replaced by the app on mount, so the first beat reads
         as Mutual Mesh, not a blank/broken screen. -->
    <div id="root">
      <div id="mm-splash">
        <div class="mm-mark" aria-hidden="true"><span>M</span></div>
        <p class="mm-name">Mutual Mesh</p>
        <p class="mm-tag">Privacy-first mutual aid — food, baby supplies, hygiene, and HRT, shared neighbourhood to neighbourhood.</p>
        <div class="mm-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="mm-by">A project by <a href="https://skypistudio.com" target="_blank" rel="noopener">Sky Halisky</a> · see more work at skypistudio.com</p>
      </div>
    </div>
  </body>
</html>
